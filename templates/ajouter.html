{% extends 'base.html' %}
{% block content %}
<section class="form-container-box">
    <h1>AJOUTER UNE FILIALE</h1>
    <form action="{{ url_for('ajouter_filiale') }}" method="POST" class="secure-form">
        <div class="form-group">
            <label for="ville">Ville</label>
            <input type="text" id="ville" name="ville" placeholder="Ex: Paris" required>
        </div>
        <div class="form-group">
            <label for="adresse">Adresse</label>
            <input type="text" id="adresse" name="adresse" placeholder="Ex: 102 Av. des Champs-Élysées" required>
        </div>
        <div class="form-group">
            <label for="responsable">Responsable</label>
            <input type="text" id="responsable" name="responsable" placeholder="Ex: Jean Dupont" required>
        </div>
        <div class="form-group">
            <label for="employes">Nombre d'employés</label>
            <input type="number" id="employes" name="employes" placeholder="Ex: 50" required>
        </div>
        <div class="form-group">
            <label for="ip">Adresse IP du routeur</label>
            <input type="text" id="ip" name="ip" placeholder="Ex: 192.168.1.1" required>
        </div>
        <button type="submit" class="btn-submit">ENREGISTRER LA FILIALE</button>
    </form>
</section>
{% endblock %}
